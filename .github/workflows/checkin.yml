name: Mihoyo Daily Check-in

on:
  schedule:
    # GitHub 定时是"尽力而为"，整点/半点最挤、易被延迟甚至跳过，所以错开整点 + 多设兜底时间。
    # cron 用 UTC。脚本对"已签到"会跳过，所以一天多跑几次也不会重复签到。
    - cron: "23 0 * * *"   # UTC 0:23 = 北京 8:23
    - cron: "47 3 * * *"   # UTC 3:47 = 北京 11:47（上一次没跑成功时兜底）
    - cron: "13 8 * * *"   # UTC 8:13 = 北京 16:13（再兜一次，确保当天不断签）
  workflow_dispatch: {}        # 允许在 Actions 页面手动触发，方便测试

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write          # keepalive 步骤要往 main 推空提交
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run check-in
        env:
          COOKIE: ${{ secrets.COOKIE }}
          SCT_KEY: ${{ secrets.SCT_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python sign.py

      # GitHub 会把"连续 60 天无仓库活动"的仓库里的 schedule 工作流自动停用
      # （2026-08-25 就这样断过一次，静默停跑，没有任何运行记录）。
      # 这里在提交年龄接近阈值时推一个空提交刷新计时器。
      # 用 GITHUB_TOKEN 推的提交不会再触发工作流，不存在递归。
      # 即使上面签到失败也要保活，所以是 always()。
      - name: Keepalive
        if: always()
        run: |
          AGE_DAYS=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "距上次提交 ${AGE_DAYS} 天"
          if [ "$AGE_DAYS" -ge 45 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive，防止 schedule 被 GitHub 自动停用"
            git push
            echo "已推空提交刷新活动计时器"
          else
            echo "未到阈值（45 天），跳过"
          fi
